<!doctype html>
<!--
  SYNTHETIC FIXTURE — NOT REAL BOSS ZHIPIN MARKUP.

  An outgoing bubble that FAILED to send. Both status shapes the reader knows
  are present on purpose:
    - a structural hook: [data-jobpilot-status='failed']
    - a visible marker:   the text 发送失败

  Selectors this fixture is intended to satisfy (confidence "fixture-only"):
    chatRoot, chatEditor, chatHeader, jobTitleInChat, companyInChat,
    chatJobIdAttribute, commonPhraseToggle, commonPhrasePanel,
    commonPhraseItem, sendButton, outgoingMessage, outgoingMessageBody,
    messageSendFailed (via [data-jobpilot-status='failed']).

  Expected behaviour: readOutgoingMessageBodies() returns ONLY the older,
  successfully delivered message. The failed bubble's text must NOT appear in
  the list, so countOutgoingMessages() for the failed text is 0. A test that
  asserted 1 here would be asserting that a failed send counts as delivered —
  exactly the bug this fixture exists to catch.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>沟通会话（发送失败） - 合成测试夹具</title>
  </head>
  <body>
    <header class="page-header">合成夹具 · 非真实站点</header>

    <main class="chat-page">
      <section class="chat-panel" data-jobpilot-chat data-job-id="job-12345">
        <header class="chat-header" data-jobpilot-chat-header>
          <span class="chat-header__recruiter" data-jobpilot-chat-recruiter>李女士</span>
          <a
            class="chat-header__job-title"
            data-jobpilot-chat-title
            data-job-id="job-12345"
            href="/job_detail/job-12345.html"
          >
            后端开发工程师
          </a>
          <span class="chat-header__company" data-jobpilot-chat-company>示例科技有限公司</span>
        </header>

        <div class="chat-messages">
          <div class="message-item is-incoming">
            <div class="message-item__body">您好，感谢您的关注。</div>
          </div>

          <!-- Delivered earlier; this one is real evidence. -->
          <div class="message-item is-outgoing" data-jobpilot-outgoing>
            <div class="message-item__body" data-jobpilot-body>您好，我对这个职位很感兴趣。</div>
          </div>

          <!-- NOT delivered. Must be excluded from every success count. -->
          <div
            class="message-item is-outgoing message-item--failed"
            data-jobpilot-outgoing
            data-jobpilot-status="failed"
          >
            <div class="message-item__body" data-jobpilot-body>
              您好，我对这个职位很感兴趣，方便聊聊吗？
            </div>
            <div class="message-item__status message-item__status--failed">发送失败</div>
          </div>
        </div>

        <div class="chat-editor">
          <button
            type="button"
            class="chat-editor__phrase-toggle"
            data-jobpilot-action="common-phrases"
          >
            常用语
          </button>

          <div
            class="chat-editor__input"
            data-jobpilot-editor
            contenteditable="true"
            role="textbox"
            aria-label="输入消息"
          ></div>

          <button type="button" class="chat-editor__send" data-jobpilot-action="send">发送</button>

          <ul class="common-phrase-panel" data-jobpilot-common-phrases>
            <li data-jobpilot-common-phrase>您好，我对这个职位很感兴趣，方便聊聊吗？</li>
            <li data-jobpilot-common-phrase>您好，请问该岗位还在招聘吗？</li>
            <li data-jobpilot-common-phrase>您好，我已发送简历，期待您的回复。</li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
