<!doctype html>
<!--
  SYNTHETIC FIXTURE — mirrors the REAL BOSS Zhipin chat DOM captured on
  2026-09-21 (see chat-conversation.html for the evidence pointer), content
  sanitized.

  An outgoing bubble that FAILED to send. Both failure shapes the reader knows
  are present on purpose, mirroring how the real site marks a failed bubble:
    - a structural hook: the extra class send-failed on the li
    - a visible marker:   the text 发送失败 inside the bubble

  Real selectors this fixture is intended to satisfy: identical to
  chat-conversation.html, plus messageSendFailed via the send-failed class
  (the visible 发送失败 text is the reader's fallback signal).

  Expected behaviour: readOutgoingMessageBodies() returns ONLY the older,
  successfully delivered message. The failed bubble's text must NOT appear in
  the list, so countOutgoingMessages() for the failed text is 0. A test that
  asserted 1 here would be asserting that a failed send counts as delivered —
  exactly the bug this fixture exists to catch.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>沟通会话（发送失败） - 合成测试夹具</title>
  </head>
  <body>
    <header class="page-header">合成夹具 · 内容已脱敏 · 结构镜像 2026-09-21 实拍</header>

    <main class="chat-page">
      <div class="chat-conversation" data-job-id="job-12345">
        <div class="chat-header">
          <span class="recruiter-name">李女士</span>
          <span class="base-title">招聘经理</span>
          <span class="company-name">示例科技有限公司</span>
          <a href="/job_detail/job-12345.html" class="job-card-title">后端开发工程师</a>
        </div>

        <div class="chat-message">
          <ul class="im-list">
            <li data-mid="mid-1002" class="message-item item-friend">
              <div class="item-message-body">您好，感谢您的关注。</div>
            </li>
            <!-- Delivered earlier; this one is real evidence. -->
            <li data-mid="mid-3001" class="message-item item-myself">
              <div class="item-message-body">您好，我对这个职位很感兴趣。</div>
            </li>
            <!-- NOT delivered. Must be excluded from every success count. -->
            <li data-mid="mid-3002" class="message-item item-myself send-failed">
              <div class="item-message-body">您好，我对这个职位很感兴趣，方便聊聊吗？</div>
              <div class="send-status">发送失败</div>
            </li>
          </ul>
        </div>

        <button class="chat-tool-item phrase-toggle">常用语</button>

        <div class="common-phrase-panel">
          <ul>
            <li class="phrase-item">您好，我对这个职位很感兴趣。</li>
            <li class="phrase-item">您好，方便沟通一下吗？</li>
            <li class="phrase-item">期待您的回复。</li>
          </ul>
        </div>

        <div class="chat-editor">
          <div contenteditable="true" id="chat-input" class="chat-input"></div>
          <button type="send" class="btn-v2 btn-sure-v2 btn-send">发送</button>
        </div>
      </div>
    </main>
  </body>
</html>
