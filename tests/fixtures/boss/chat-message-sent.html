<!doctype html>
<!--
  SYNTHETIC FIXTURE — mirrors the REAL BOSS Zhipin chat DOM captured on
  2026-09-21 (see chat-conversation.html for the evidence pointer), content
  sanitized.

  Same conversation shape as chat-conversation.html, but the intended message IS
  already present in the outgoing list, and the editor is empty again. This is
  the post-send state, used to test send observation: with baseline 0,
  observeSend() must report {kind:"observed"}.

  Real selectors this fixture is intended to satisfy: identical to
  chat-conversation.html (chatRoot .chat-conversation, chatEditor #chat-input,
  chatHeader .chat-header, jobTitleInChat a.job-card-title,
  companyInChat span.company-name, chatJobIdAttribute data-job-id,
  commonPhraseToggle button.phrase-toggle, commonPhrasePanel
  .common-phrase-panel, commonPhraseItem li.phrase-item, sendButton
  button.btn-send, outgoingMessage li.message-item.item-myself,
  outgoingMessageBody .item-message-body).

  The second outgoing text below ("您好，我对这个职位很感兴趣，方便聊聊吗？") is
  the message the adapter sends in these tests, so a test can prove the adapter
  reports the text it actually observed.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>沟通会话（已发送） - 合成测试夹具</title>
  </head>
  <body>
    <header class="page-header">合成夹具 · 内容已脱敏 · 结构镜像 2026-09-21 实拍</header>

    <main class="chat-page">
      <div class="chat-conversation" data-job-id="job-12345">
        <div class="chat-header">
          <span class="recruiter-name">李女士</span>
          <span class="base-title">招聘经理</span>
          <span class="company-name">示例科技有限公司</span>
          <a href="/job_detail/job-12345.html" class="job-card-title">后端开发工程师</a>
        </div>

        <div class="chat-message">
          <ul class="im-list">
            <li data-mid="mid-1002" class="message-item item-friend">
              <div class="item-message-body">您好，感谢您的关注。</div>
            </li>
            <li data-mid="mid-2001" class="message-item item-myself">
              <div class="item-message-body">您好，我对这个职位很感兴趣。</div>
            </li>
            <!-- The message the adapter just sent. -->
            <li data-mid="mid-2002" class="message-item item-myself">
              <div class="item-message-body">您好，我对这个职位很感兴趣，方便聊聊吗？</div>
            </li>
          </ul>
        </div>

        <button class="chat-tool-item phrase-toggle">常用语</button>

        <div class="common-phrase-panel">
          <ul>
            <li class="phrase-item">您好，我对这个职位很感兴趣。</li>
            <li class="phrase-item">您好，方便沟通一下吗？</li>
            <li class="phrase-item">期待您的回复。</li>
          </ul>
        </div>

        <div class="chat-editor">
          <!-- Emptied after a successful send, as BOSS-like editors do. -->
          <div contenteditable="true" id="chat-input" class="chat-input"></div>
          <button type="send" class="btn-v2 btn-sure-v2 btn-send">发送</button>
        </div>
      </div>
    </main>
  </body>
</html>
