<!doctype html>
<!--
  SYNTHETIC FIXTURE — mirrors the REAL BOSS Zhipin chat DOM captured on
  2026-09-21 (see chat-conversation.html for the evidence pointer), content
  sanitized.

  A conversation that is emphatically NOT the target job. It carries a DIFFERENT
  job id, title, company and recruiter than the intent a test builds for
  "job-12345 / 后端开发工程师 / 示例科技有限公司". Used to prove that
  matchChatIdentity rejects it and that prepareMessage/dispatchSend return a
  mismatch block instead of sending into the wrong conversation.

  Real selectors this fixture is intended to satisfy: identical to
  chat-conversation.html (chatRoot .chat-conversation carrying
  data-job-id="job-99999", chatEditor #chat-input, chatHeader .chat-header,
  jobTitleInChat a.job-card-title[href="/job_detail/job-99999.html"],
  companyInChat span.company-name, chatJobIdAttribute data-job-id,
  commonPhraseToggle button.phrase-toggle, commonPhrasePanel
  .common-phrase-panel, commonPhraseItem li.phrase-item, sendButton
  button.btn-send, outgoingMessage li.message-item.item-myself,
  outgoingMessageBody .item-message-body).

  Note the DOM is otherwise IDENTICAL in shape to chat-conversation.html: the
  ONLY difference is identity. A test that passes here must be asserting on
  identity, not on structure.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>沟通会话（错误的职位） - 合成测试夹具</title>
  </head>
  <body>
    <header class="page-header">合成夹具 · 内容已脱敏 · 结构镜像 2026-09-21 实拍</header>

    <main class="chat-page">
      <div class="chat-conversation" data-job-id="job-99999">
        <div class="chat-header">
          <span class="recruiter-name">赵女士</span>
          <span class="base-title">招聘经理</span>
          <span class="company-name">另一家示例文化传媒有限公司</span>
          <a href="/job_detail/job-99999.html" class="job-card-title">市场推广专员</a>
        </div>

        <div class="chat-message">
          <ul class="im-list">
            <li data-mid="mid-1002" class="message-item item-friend">
              <div class="item-message-body">您好，感谢您的关注。</div>
            </li>
            <li data-mid="mid-1001" class="message-item item-myself">
              <div class="item-message-body">您好，我对这个职位很感兴趣。</div>
            </li>
          </ul>
        </div>

        <button class="chat-tool-item phrase-toggle">常用语</button>

        <div class="common-phrase-panel">
          <ul>
            <li class="phrase-item">您好，我对这个职位很感兴趣。</li>
            <li class="phrase-item">您好，方便沟通一下吗？</li>
            <li class="phrase-item">期待您的回复。</li>
          </ul>
        </div>

        <div class="chat-editor">
          <div contenteditable="true" id="chat-input" class="chat-input"></div>
          <button type="send" class="btn-v2 btn-sure-v2 btn-send">发送</button>
        </div>
      </div>
    </main>
  </body>
</html>
