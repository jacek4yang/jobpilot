<!doctype html>
<!--
  SYNTHETIC FIXTURE — NOT REAL BOSS ZHIPIN MARKUP.

  A conversation that is emphatically NOT the target job. It carries a DIFFERENT
  job id, title and company than the intent a test builds for
  "job-12345 / 后端开发工程师 / 示例科技有限公司". Used to prove that
  matchChatIdentity rejects it and that prepareMessage/dispatchSend return a
  mismatch block instead of sending into the wrong conversation.

  Selectors this fixture is intended to satisfy (confidence "fixture-only"):
    chatRoot, chatEditor, chatHeader, jobTitleInChat, companyInChat,
    chatJobIdAttribute, commonPhraseToggle, commonPhrasePanel,
    commonPhraseItem, sendButton, outgoingMessage, outgoingMessageBody.

  Note the DOM is otherwise IDENTICAL in shape to chat-conversation.html: the
  ONLY difference is identity. A test that passes here must be asserting on
  identity, not on structure.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>沟通会话（错误的职位） - 合成测试夹具</title>
  </head>
  <body>
    <header class="page-header">合成夹具 · 非真实站点</header>

    <main class="chat-page">
      <section class="chat-panel" data-jobpilot-chat data-job-id="job-99999">
        <header class="chat-header" data-jobpilot-chat-header>
          <span class="chat-header__recruiter" data-jobpilot-chat-recruiter>赵女士</span>
          <a
            class="chat-header__job-title"
            data-jobpilot-chat-title
            data-job-id="job-99999"
            href="/job_detail/job-99999.html"
          >
            市场推广专员
          </a>
          <span class="chat-header__company" data-jobpilot-chat-company>另一家示例文化传媒有限公司</span>
        </header>

        <div class="chat-messages">
          <div class="message-item is-incoming">
            <div class="message-item__body">您好，请问有什么可以帮您？</div>
          </div>

          <div class="message-item is-outgoing" data-jobpilot-outgoing>
            <div class="message-item__body" data-jobpilot-body>您好，我想了解一下这个岗位。</div>
          </div>
        </div>

        <div class="chat-editor">
          <button
            type="button"
            class="chat-editor__phrase-toggle"
            data-jobpilot-action="common-phrases"
          >
            常用语
          </button>

          <div
            class="chat-editor__input"
            data-jobpilot-editor
            contenteditable="true"
            role="textbox"
            aria-label="输入消息"
          ></div>

          <button type="button" class="chat-editor__send" data-jobpilot-action="send">发送</button>

          <ul class="common-phrase-panel" data-jobpilot-common-phrases>
            <li data-jobpilot-common-phrase>您好，我对这个职位很感兴趣，方便聊聊吗？</li>
            <li data-jobpilot-common-phrase>您好，请问该岗位还在招聘吗？</li>
            <li data-jobpilot-common-phrase>您好，我已发送简历，期待您的回复。</li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
