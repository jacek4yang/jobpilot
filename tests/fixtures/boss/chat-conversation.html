<!doctype html>
<!--
  SYNTHETIC FIXTURE — NOT REAL BOSS ZHIPIN MARKUP.
  Hand-authored for JobPilot communication-adapter unit tests. The real BOSS
  chat DOM was never inspected; this file exists only to exercise the reader
  plumbing in src/adapters/boss/communication/.

  Selectors this fixture is intended to satisfy (all confidence "fixture-only"):
    chatRoot             [data-jobpilot-chat]
    chatEditor           [data-jobpilot-editor]  (contenteditable div)
    chatHeader           [data-jobpilot-chat-header]
    jobTitleInChat       [data-jobpilot-chat-title]
    companyInChat        [data-jobpilot-chat-company]
    chatJobIdAttribute   data-job-id
    commonPhraseToggle   [data-jobpilot-action='common-phrases']
    commonPhrasePanel    [data-jobpilot-common-phrases]
    commonPhraseItem     [data-jobpilot-common-phrases] li
    sendButton           [data-jobpilot-action='send']   (label exactly 发送)
    outgoingMessage      [data-jobpilot-outgoing]
    outgoingMessageBody  [data-jobpilot-outgoing] [data-jobpilot-body]

  Not present here on purpose: messageSendFailed, successModal, unknownModal,
  riskBanner — see chat-message-failed.html, success-modal.html,
  unknown-modal.html and risk-page.html.
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>沟通会话 - 合成测试夹具</title>
  </head>
  <body>
    <header class="page-header">合成夹具 · 非真实站点</header>

    <main class="chat-page">
      <section class="chat-panel" data-jobpilot-chat data-job-id="job-12345">
        <header class="chat-header" data-jobpilot-chat-header>
          <span class="chat-header__recruiter" data-jobpilot-chat-recruiter>李女士</span>
          <a
            class="chat-header__job-title"
            data-jobpilot-chat-title
            data-job-id="job-12345"
            href="/job_detail/job-12345.html"
          >
            后端开发工程师
          </a>
          <span class="chat-header__company" data-jobpilot-chat-company>示例科技有限公司</span>
        </header>

        <div class="chat-messages">
          <div class="message-item is-incoming">
            <div class="message-item__body">您好，感谢您的关注。</div>
          </div>
          <div class="message-item is-incoming">
            <div class="message-item__body">请问您方便发一份简历吗？</div>
          </div>

          <div class="message-item is-outgoing" data-jobpilot-outgoing>
            <div class="message-item__body" data-jobpilot-body>您好，我对这个职位很感兴趣。</div>
          </div>
        </div>

        <div class="chat-editor">
          <button
            type="button"
            class="chat-editor__phrase-toggle"
            data-jobpilot-action="common-phrases"
          >
            常用语
          </button>

          <div
            class="chat-editor__input"
            data-jobpilot-editor
            contenteditable="true"
            role="textbox"
            aria-label="输入消息"
          ></div>

          <button type="button" class="chat-editor__send" data-jobpilot-action="send">发送</button>

          <ul class="common-phrase-panel" data-jobpilot-common-phrases>
            <li data-jobpilot-common-phrase>您好，我对这个职位很感兴趣，方便聊聊吗？</li>
            <li data-jobpilot-common-phrase>您好，请问该岗位还在招聘吗？</li>
            <li data-jobpilot-common-phrase>您好，我已发送简历，期待您的回复。</li>
          </ul>
        </div>
      </section>
    </main>
  </body>
</html>
